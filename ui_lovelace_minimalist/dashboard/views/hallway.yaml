---
# Hallway view
#

title: "Hall"
path: "hallway"
cards:
  - type: custom:decluttering-card
    template: room_view_base
    variables:
      - title: Hall
      - motion_sensor: binary_sensor.motion_hallway
      - lights: light.all_hallway
      - temperature: sensor.temperature_hallway

  - type: "custom:button-card"
    template: card_title
    label: "Enheter"

  - type: "horizontal-stack"
    cards:
      - type: "custom:button-card"
        template: card_light
        entity: light.ceiling_lamp_entrance
        variables:
          ulm_card_light_name: "Lampa"
