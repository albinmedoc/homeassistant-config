esphome:
  name: "p1-reader"
  friendly_name: "P1 Reader"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: "lKRkhE5NQwRumCWQNT/itE/mqC7CqhE4XUFQt4kyQZ0="

ota:
  platform: esphome
  password: "8fdfeaa66cc6b0c6690251c4d6be8c95"

external_components:
  - source: github://Beaky2000/esphome-p1mini

binary_sensor:

switch:
  - platform: gpio
    id: p1_rts
    pin:
      number: GPIO21  # D6

uart:
  - id: my_uart_1
    rx_pin: 
      number: GPIO20  # D7
      inverted: true
      mode: INPUT_PULLUP
    baud_rate: 115200
    rx_buffer_size: 1024

p1_mini:
  - id: p1_mini_1
    uart_id: my_uart_1
    minimum_period: 10s
    buffer_size: 3072
    on_ready_to_receive:
      - switch.turn_on: p1_rts
      - logger.log: "RTS ON"
    on_receiving_update:
      - logger.log: "Receiving..."
    on_update_received:
      - switch.turn_off: p1_rts
      - logger.log: "Update received"
    on_update_processed:
      - logger.log: "Processed!"
    on_communication_error:
      - switch.turn_off: p1_rts
      - logger.log:
          level: ERROR
          format: "Communication error!"

text_sensor:
  - platform: p1_mini
    name: "Meter ID"
    p1_mini_id: p1_mini_1
    identifier: "/"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 10s
  - platform: p1_mini
    p1_mini_id: p1_mini_1
    obis_code: "1.8.0"
    name: "Cumulative Active Import"
    icon: "mdi:transmission-tower-export"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    state_class: "total_increasing"
    device_class: "energy"
