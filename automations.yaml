- id: '1763564014123'
  alias: Tänd framlampor när mörkt och någon borta
  description: Tänder lamporna på framsidan om det är mörkt ute och någon inte är
    hemma
  triggers:
  - trigger: sun
    event: sunset
    offset: -00:30:00
  - entity_id: zone.home
    trigger: state
  conditions:
  - condition: sun
    after: sunset
    after_offset: -00:30:00
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set count_home = states(''zone.home'') | int(0) %} {%
          set total = states.person | count %} {{ count_home < total }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.all_outside_front
    - conditions:
      - condition: template
        value_template: '{% set count_home = states(''zone.home'') | int(0) %} {%
          set total = states.person | count %} {{ count_home == total }}'
      sequence:
      - delay:
          minutes: 5
      - condition: template
        value_template: '{% set count_home = states(''zone.home'') | int(0) %} {%
          set total = states.person | count %} {{ count_home == total }}'
      - action: light.turn_off
        target:
          entity_id: light.all_outside_front
  mode: restart
